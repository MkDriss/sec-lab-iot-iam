; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
platform = espressif32 @ ~8.0.0 ; on vient figer la version
board = esp32cam
framework = arduino

monitor_speed = 115200

; Indispensable avec la base ESP32-CAM-MB
; mechanisme d'auto flash a l'ouverture
; on les set a 0 pour eviter de bloquer la carte 
monitor_rts = 0
monitor_dtr = 0

upload_port = /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A5069RR4-if00-port0
monitor_port = /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A5069RR4-if00-port0